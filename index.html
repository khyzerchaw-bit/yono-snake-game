
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yono Snake Game</title>

<style>
* {
  box-sizing: border-box;
}

body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
}

h1 {
  color: limegreen;
  text-shadow: 0 0 12px limegreen;
}

/* LOADING SCREEN */
.screen {
  position: fixed;
  inset: 0;
  background: #080808;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#loadingScreen h1,
#startScreen h1 {
  font-size: 45px;
  color: limegreen;
}

.loader {
  width: 260px;
  height: 16px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  width: 0;
  height: 100%;
  background: limegreen;
  animation: load 2.5s linear forwards;
}

@keyframes load {
  to { width: 100%; }
}

/* MENU */
#startScreen {
  display: none;
}

#startScreen p {
  color: #aaa;
}

/* BUTTONS */
button {
  background: limegreen;
  color: black;
  border: none;
  border-radius: 8px;
  padding: 14px 30px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #8cff00;
}

/* GAME */
#gameScreen {
  display: none;
  padding: 10px;
}

canvas {
  background: black;
  border: 3px solid limegreen;
  width: min(600px, 95vw);
  height: auto;
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen" class="screen">
  <h1>YONO SNAKE</h1>
  <p>Preparing your game...</p>

  <div class="loader">
    <div class="progress"></div>
  </div>

  <p>Loading...</p>
</div>

<!-- START MENU -->
<div id="startScreen" class="screen">
  <h1>YONO SNAKE</h1>
  <p>Classic Snake Game</p>
  <p>🍎 Eat apples to earn points!</p>
  <p>💣 Avoid the bombs!</p>

  <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME -->
<div id="gameScreen">

  <h1>Yono Snake Game</h1>

  <p>Score: <span id="score">0</span></p>
  <p>High Score: <span id="high">0</span></p>

  <canvas id="game" width="600" height="600"></canvas>

  <br>

  <button onclick="restart()">RESTART</button>
  <button onclick="backToMenu()">MAIN MENU</button>

  <p>Arrow Keys or WASD to move</p>
  <p>🍎 Apple = +1 Point | 💣 Bomb = Game Over</p>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;

let snake, apple, bomb;
let dx, dy, score, high;
let gameOver = false;
let timer;

high = Number(localStorage.getItem("yonoHigh")) || 0;

document.getElementById("high").textContent = high;

// LOADING TO MENU
window.onload = function() {
  setTimeout(() => {
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";
  }, 2600);
};

// START GAME
function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  restart();
}

// RESTART
function restart() {
  clearInterval(timer);

  snake = [
    {x: 300, y: 300},
    {x: 280, y: 300},
    {x: 260, y: 300}
  ];

  dx = size;
  dy = 0;
  score = 0;
  gameOver = false;

  document.getElementById("score").textContent = score;

  apple = {x: 100, y: 100};
  bomb = null;

  spawnApple();
  spawnBomb();

  draw();

  timer = setInterval(update, 100);
}

// MAIN MENU
function backToMenu() {
  clearInterval(timer);
  gameOver = true;

  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
}

// RANDOM POSITION
function randomPosition() {
  return {
    x: Math.floor(Math.random() * 30) * size,
    y: Math.floor(Math.random() * 30) * size
  };
}

// APPLE
function spawnApple() {
  do {
    apple = randomPosition();
  } while (
    snake.some(p => p.x === apple.x && p.y === apple.y) ||
    (bomb && bomb.x === apple.x && bomb.y === apple.y)
  );
}

// BOMB
function spawnBomb() {
  do {
    bomb = randomPosition();
  } while (
    snake.some(p => p.x === bomb.x && p.y === bomb.y) ||
    (apple && bomb.x === apple.x && bomb.y === apple.y)
  );
}

// UPDATE GAME
function update() {

  if (gameOver) return;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  // WALL COLLISION
  if (
    head.x < 0 || head.x >= 600 ||
    head.y < 0 || head.y >= 600
  ) {
    endGame();
    return;
  }

  const eatingApple =
    head.x === apple.x && head.y === apple.y;

  // SELF COLLISION
  const bodyToCheck = eatingApple
    ? snake
    : snake.slice(0, -1);

  if (bodyToCheck.some(p => p.x === head.x && p.y === head.y)) {
    endGame();
    return;
  }

  // BOMB COLLISION
  if (head.x === bomb.x && head.y === bomb.y) {
    endGame();
    return;
  }

  snake.unshift(head);

  // EAT APPLE
  if (eatingApple) {

    score++;

    document.getElementById("score").textContent = score;

    if (score > high) {
      high = score;

      localStorage.setItem("yonoHigh", high);

      document.getElementById("high").textContent = high;
    }

    spawnApple();
  } else {
    snake.pop();
  }

  // RANDOMLY MOVE BOMB AFTER APPLE
  if (eatingApple) {
    spawnBomb();
  }

  draw();
}

// GAME OVER
function endGame() {
  gameOver = true;
  clearInterval(timer);
  draw();

  ctx.fillStyle = "red";
  ctx.font = "bold 45px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", 300, 280);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Final Score: " + score, 300, 320);
}

// DRAW
function draw() {

  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 600, 600);

  // APPLE
  ctx.font = "20px Arial";
  ctx.textAlign = "center";
  ctx.fillText("🍎", apple.x + 10, apple.y + 17);

  // BOMB
  ctx.fillText("💣", bomb.x + 10, bomb.y + 17);

  // SNAKE
  snake.forEach((part, index) => {

    ctx.fillStyle = index === 0 ? "limegreen" : "green";

    ctx.fillRect(
      part.x,
      part.y,
      size - 1,
      size - 1
    );

  });
}

// KEYBOARD CONTROLS
document.addEventListener("keydown", function(e) {

  const key = e.key.toLowerCase();

  if (document.getElementById("gameScreen").style.display !== "block" || gameOver) return;

  if ((key === "arrowup" || key === "w") && dy === 0) {
    dx = 0;
    dy = -size;
  }

  else if ((key === "arrowdown" || key === "s") && dy === 0) {
    dx = 0;
    dy = size;
  }

  else if ((key === "arrowleft" || key === "a") && dx === 0) {
    dx = -size;
    dy = 0;
  }

  else if ((key === "arrowright" || key === "d") && dx === 0) {
    dx = size;
    dy = 0;
  }

});

</script>

</body>
</html>
