<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yono Snake Game</title>

<style>
* { box-sizing: border-box; }

body {
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
}

h1 {
  color: limegreen;
  text-shadow: 0 0 12px limegreen;
}

.screen {
  position: fixed;
  inset: 0;
  background: #080808;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#startScreen { display: none; }

.loader {
  width: 260px;
  height: 16px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  width: 0;
  height: 100%;
  background: limegreen;
  animation: load 2.5s linear forwards;
}

@keyframes load {
  to { width: 100%; }
}

button {
  background: limegreen;
  color: black;
  border: none;
  border-radius: 8px;
  padding: 14px 30px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #8cff00; }

#gameScreen {
  display: none;
  padding: 10px;
}

canvas {
  background: #050505;
  border: 4px solid limegreen;
  width: min(600px, 95vw);
  height: auto;
  display: block;
  margin: auto;
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="screen">
  <h1>YONO SNAKE</h1>
  <p>Preparing your game...</p>
  <div class="loader">
    <div class="progress"></div>
  </div>
  <p>Loading...</p>
</div>

<!-- MAIN MENU -->
<div id="startScreen" class="screen">
  <h1>YONO SNAKE</h1>
  <p>Classic Snake Challenge</p>
  <p>🍎 Eat apples to earn points!</p>
  <p>💣 Avoid bombs and walls!</p>
  <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME -->
<div id="gameScreen">

<h1>Yono Snake Game</h1>

<p>Score: <span id="score">0</span></p>
<p>High Score: <span id="high">0</span></p>

<canvas id="game" width="600" height="600"></canvas>

<p>🍎 Apple = +1 | 💣 Bomb = Game Over</p>
<p>🧱 Walls = Game Over</p>
<p>Use Arrow Keys or WASD to move</p>

<button onclick="restart()">RESTART</button>
<button onclick="backToMenu()">MAIN MENU</button>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;
const cells = 30;

let snake, apple, bomb, walls;
let dx, dy, score, high;
let gameOver = false;
let timer;

high = Number(localStorage.getItem("yonoHigh")) || 0;
document.getElementById("high").textContent = high;

// LOADING SCREEN
window.onload = function() {
  setTimeout(() => {
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";
  }, 2600);
};

// START
function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  restart();
}

// MAIN MENU
function backToMenu() {
  clearInterval(timer);
  gameOver = true;

  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
}

// RANDOM POSITION
function randomPosition() {
  return {
    x: Math.floor(Math.random() * cells),
    y: Math.floor(Math.random() * cells)
  };
}

function occupied(x, y) {
  return snake.some(p => p.x === x && p.y === y) ||
    walls.some(p => p.x === x && p.y === y);
}

function freePosition() {
  let position;
  let attempts = 0;

  do {
    position = randomPosition();
    attempts++;
  } while (
    (occupied(position.x, position.y) ||
     (bomb && bomb.x === position.x && bomb.y === position.y) ||
     (apple && apple.x === position.x && apple.y === position.y))
    && attempts < 1000
  );

  return position;
}

// CREATE WALLS
function createWalls() {
  walls = [];

  // Random horizontal and vertical obstacles
  for (let i = 0; i < 7; i++) {
    let horizontal = Math.random() < 0.5;
    let x = 3 + Math.floor(Math.random() * 22);
    let y = 3 + Math.floor(Math.random() * 22);
    let length = 3 + Math.floor(Math.random() * 3);

    for (let j = 0; j < length; j++) {
      let wx = horizontal ? x + j : x;
      let wy = horizontal ? y : y + j;

      // Keep the starting area clear
      if (wx >= 10 && wx <= 18 && wy >= 10 && wy <= 18) {
        continue;
      }

      walls.push({x: wx, y: wy});
    }
  }
}

// SPAWN APPLE
function spawnApple() {
  apple = freePosition();
}

// SPAWN BOMB
function spawnBomb() {
  bomb = freePosition();
}

// RESTART
function restart() {
  clearInterval(timer);

  snake = [
    {x: 14, y: 15},
    {x: 13, y: 15},
    {x: 12, y: 15}
  ];

  dx = 1;
  dy = 0;
  score = 0;
  gameOver = false;

  document.getElementById("score").textContent = score;

  createWalls();

  apple = null;
  bomb = null;

  spawnApple();
  spawnBomb();

  draw();

  timer = setInterval(update, 110);
}

// UPDATE GAME
function update() {
  if (gameOver) return;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  // WALL COLLISION
  if (
    head.x < 0 || head.x >= cells ||
    head.y < 0 || head.y >= cells ||
    walls.some(w => w.x === head.x && w.y === head.y)
  ) {
    endGame();
    return;
  }

  const eatingApple =
    head.x === apple.x && head.y === apple.y;

  // SELF COLLISION
  const body = eatingApple ? snake : snake.slice(0, -1);

  if (body.some(p => p.x === head.x && p.y === head.y)) {
    endGame();
    return;
  }

  // BOMB COLLISION
  if (head.x === bomb.x && head.y === bomb.y) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (eatingApple) {
    score++;

    document.getElementById("score").textContent = score;

    if (score > high) {
      high = score;
      localStorage.setItem("yonoHigh", high);
      document.getElementById("high").textContent = high;
    }

    spawnApple();
    spawnBomb();

  } else {
    snake.pop();
  }

  draw();
}

// GAME OVER
function endGame() {
  gameOver = true;
  clearInterval(timer);

  draw();

  ctx.fillStyle = "red";
  ctx.font = "bold 45px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", 300, 280);

  ctx.fillStyle = "white";
  ctx.font = "22px Arial";
  ctx.fillText("Final Score: " + score, 300, 325);
}

// DRAW GAME
function draw() {
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, 600, 600);

  // WALLS
  walls.forEach(w => {
    ctx.fillStyle = "#777";
    ctx.fillRect(w.x * size, w.y * size, size, size);

    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x * size, w.y * size, size, size);
  });

  // APPLE - BIGGER
  ctx.font = "29px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(
    "🍎",
    apple.x * size + 10,
    apple.y * size + 10
  );

  // BOMB - BIGGER
  ctx.font = "29px Arial";
  ctx.fillText(
    "💣",
    bomb.x * size + 10,
    bomb.y * size + 10
  );

  // BIGGER SNAKE
  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? "#7CFC00" : "#159b27";

    ctx.fillRect(
      part.x * size + 1,
      part.y * size + 1,
      size - 2,
      size - 2
    );

    ctx.strokeStyle = "#050505";
    ctx.lineWidth = 1;
    ctx.strokeRect(
      part.x * size + 1,
      part.y * size + 1,
      size - 2,
      size - 2
    );
  });
}

// KEYBOARD CONTROLS
document.addEventListener("keydown", function(e) {
  const key = e.key.toLowerCase();

  if (
    document.getElementById("gameScreen").style.display !== "block" ||
    gameOver
  ) return;

  if (
    (key === "arrowup" || key === "w") && dy === 0
  ) {
    dx = 0;
    dy = -1;
  }
  else if (
    (key === "arrowdown" || key === "s") && dy === 0
  ) {
    dx = 0;
    dy = 1;
  }
  else if (
    (key === "arrowleft" || key === "a") && dx === 0
  ) {
    dx = -1;
    dy = 0;
  }
  else if (
    (key === "arrowright" || key === "d") && dx === 0
  ) {
    dx = 1;
    dy = 0;
  }
});

</script>
</body>
</html>
