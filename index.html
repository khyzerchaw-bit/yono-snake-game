
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yono Snake Game</title>

<style>
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
}

h1 { color: limegreen; }

canvas {
  background: black;
  border: 3px solid limegreen;
  max-width: 95vw;
}

button {
  padding: 14px 35px;
  margin: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  background: limegreen;
  color: black;
  border: none;
  border-radius: 8px;
}

button:hover {
  background: #7cff00;
  transform: scale(1.05);
}

/* LOADING SCREEN */
.screen {
  position: fixed;
  inset: 0;
  background: #080808;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}

#loadingScreen h1,
#startScreen h1 {
  font-size: 45px;
  color: limegreen;
  text-shadow: 0 0 15px limegreen;
}

.loader {
  width: 250px;
  height: 15px;
  background: #333;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 100%;
  background: limegreen;
  animation: loading 2.5s linear forwards;
}

@keyframes loading {
  to { width: 100%; }
}

#loadingText {
  color: #aaa;
}

/* MAIN MENU */
#startScreen {
  display: none;
}

#startScreen p {
  color: #aaa;
  font-size: 18px;
}

/* GAME */
#gameScreen {
  display: none;
  padding: 10px;
}
</style>
</head>

<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="screen">
  <h1>YONO SNAKE</h1>
  <p>Welcome to Yono Snake Game!</p>
  <div class="loader">
    <div class="progress"></div>
  </div>
  <p id="loadingText">Loading Game...</p>
</div>

<!-- MAIN MENU -->
<div id="startScreen" class="screen">
  <h1>YONO SNAKE</h1>
  <p>Classic Snake Game</p>
  <p>Are you ready to play?</p>
  <button onclick="startGame()">START GAME</button>
  <p>Use Arrow Keys or WASD to move</p>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
  <h1>Yono Snake Game</h1>

  <p>Score: <span id="score">0</span></p>
  <p>High Score: <span id="high">0</span></p>

  <canvas id="game" width="600" height="600"></canvas>
  <br>

  <button onclick="restart()">RESTART</button>
  <button onclick="backToMenu()">MAIN MENU</button>

  <p>Use Arrow Keys or WASD to move</p>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const size = 20;

let snake, food, dx, dy;
let score, high, gameOver, timer;

high = Number(localStorage.getItem("yonoHigh")) || 0;

document.getElementById("high").textContent = high;

// LOADING
setTimeout(() => {
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
}, 2500);

// START GAME
function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  restart();
}

// RESTART
function restart() {
  clearInterval(timer);

  snake = [{x: 300, y: 300}];
  food = {x: 200, y: 200};

  dx = size;
  dy = 0;

  score = 0;
  gameOver = false;

  document.getElementById("score").textContent = score;

  timer = setInterval(update, 100);
  draw();
}

// MAIN MENU
function backToMenu() {
  clearInterval(timer);
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
}

// FOOD
function placeFood() {
  food = {
    x: Math.floor(Math.random() * 30) * size,
    y: Math.floor(Math.random() * 30) * size
  };

  if (snake.some(p => p.x === food.x && p.y === food.y)) {
    placeFood();
  }
}

// GAME UPDATE
function update() {
  if (gameOver) return;

  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  if (
    head.x < 0 || head.x >= 600 ||
    head.y < 0 || head.y >= 600 ||
    snake.some(p => p.x === head.x && p.y === head.y)
  ) {
    gameOver = true;
    clearInterval(timer);

    draw();

    ctx.fillStyle = "red";
    ctx.font = "40px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 300, 290);
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;

    document.getElementById("score").textContent = score;

    if (score > high) {
      high = score;
      localStorage.setItem("yonoHigh", high);
      document.getElementById("high").textContent = high;
    }

    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

// DRAW
function draw() {
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, 600, 600);

  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(food.x + 10, food.y + 10, 9, 0, Math.PI * 2);
  ctx.fill();

  snake.forEach((part, index) => {
    ctx.fillStyle = index === 0 ? "limegreen" : "green";
    ctx.fillRect(part.x, part.y, size - 1, size - 1);
  });
}

// CONTROLS
document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();

  if ((key === "arrowup" || key === "w") && dy === 0) {
    dx = 0;
    dy = -size;
  } else if ((key === "arrowdown" || key === "s") && dy === 0) {
    dx = 0;
    dy = size;
  } else if ((key === "arrowleft" || key === "a") && dx === 0) {
    dx = -size;
    dy = 0;
  } else if ((key === "arrowright" || key === "d") && dx === 0) {
    dx = size;
    dy = 0;
  }
});
</script>

</body>
</html>
